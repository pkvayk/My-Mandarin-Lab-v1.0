
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10283F">
  <title>My Mandarin Lab</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, Arial, sans-serif;
      background: #f4f7fb;
      color: #17324d;
    }
    header {
      background: #10283f;
      color: white;
      padding: 35px 22px;
      text-align: center;
    }
    h1 { margin: 0 0 10px; }
    main { padding: 20px; max-width: 600px; margin: auto; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px #0000000d;
    }
    button {
      background: #2476c7;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
    }
    .hanzi { font-size: 34px; margin: 10px 0; }
  </style>
</head>
<body>
  <header>
    <h1>My Mandarin Lab</h1>
    <p>Belajar Mandarin Percakapan</p>
  </header>
  <main>
    <div class="card">
      <h2>Pelajaran Hari Ini</h2>
      <div class="hanzi">你好</div>
      <p><b>Pinyin:</b> Nǐ hǎo</p>
      <p><b>Arti:</b> Halo</p>
      <button onclick="speak()">Dengarkan Pengucapan</button>
    </div>
    <div class="card">
      <h2>Progress Belajar</h2>
      <p>Mulai perjalanan belajar Mandarin Anda!</p>
    </div>
  </main>
  <script>
    function speak() {
      const utterance = new SpeechSynthesisUtterance("你好");
      utterance.lang = "zh-CN";
      utterance.rate = 0.8;
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
